[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hngoos-download-manager"
version = "0.1.7"
description = "Desktop download manager with resumable parallel downloads and local media tools"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "LicenseRef-Proprietary"}
authors = [{name = "hngoos"}]
dependencies = []

[project.optional-dependencies]
media = ["yt-dlp>=2025.1.15"]
processing = ["imageio-ffmpeg>=0.6"]
pdf = ["pypdfium2>=4.30", "pillow>=11"]
web = ["playwright>=1.49"]
tray = ["pystray>=0.19", "pillow>=11"]
torrent = ["libtorrent>=2.0.11"]
updates = ["cryptography>=44"]
excel = ["openpyxl>=3.1.5"]
build = ["pyinstaller>=6.11"]
dev = ["ruff>=0.9"]

[project.scripts]
hdm = "hngoos_dm.app:main"
hdm-bridge = "hngoos_dm.bridge:main"
hngoos-dm = "hngoos_dm.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hngoos_dm = ["assets/icons/*.png", "assets/icons/*.svg", "assets/branding/*"]

[tool.ruff]
line-length = 110
target-version = "py311"
