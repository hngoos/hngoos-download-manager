name: Feature request
description: Suggest an improvement and describe how it should work.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How to verify the improvement
      description: Include example inputs, expected results and error cases to handle.
