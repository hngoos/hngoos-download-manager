name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - run: python -m pip install -e ".[excel,media,processing,pdf,torrent,updates,dev]"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test browser-extension/test/*.test.js
      - run: python -m ruff check .
      - run: python scripts/fetch-archive-tools.py
      - run: python -m unittest discover -s tests -v
      - shell: pwsh
        run: ./scripts/build.ps1
      - shell: pwsh
        timeout-minutes: 2
        run: |
          $appProcess = Start-Process -FilePath ./dist/HDM.exe -ArgumentList '--smoke-test' -Wait -PassThru -WindowStyle Hidden
          if ($appProcess.ExitCode -ne 0) { throw "Packaged app smoke test failed: $($appProcess.ExitCode)" }
      - shell: pwsh
        timeout-minutes: 4
        run: |
          $report = Join-Path (Get-Location) 'dist/packaged-checks.json'
          $appProcess = Start-Process -FilePath ./dist/HDM.exe -ArgumentList '--self-test-report', $report -Wait -PassThru -WindowStyle Hidden
          Get-Content $report
          if ($appProcess.ExitCode -ne 0) { throw 'Packaged feature checks failed' }
      - shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" scripts/installer.iss'
      - run: python scripts/sign-release.py
        env:
          HNGOOS_RELEASE_SIGNING_KEY: ${{ secrets.HNGOOS_RELEASE_SIGNING_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HDM-Windows-x64
          path: |
            dist/HDM-Setup-*.exe
            dist/HDM-Browser-Extension.zip
            dist/release-notes.md
            dist/update-manifest.json
