name: Release packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    uses: ./.github/workflows/ci.yml
  desktop:
    uses: ./.github/workflows/desktop-preview.yml
  signing:
    needs: [windows, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - run: python -m pip install -e ".[updates]"
      - name: Sign when a publisher key is configured
        env:
          HNGOOS_RELEASE_SIGNING_KEY: ${{ secrets.HNGOOS_RELEASE_SIGNING_KEY }}
        shell: bash
        run: |
          if [ -n "$HNGOOS_RELEASE_SIGNING_KEY" ]; then
            python scripts/sign-release.py
          else
            echo "Packages are ready for local publisher signing. No release is published automatically."
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HDM-release-packages
          path: dist/
