name: macOS desktop packages
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'install.sh'
      - 'pyproject.toml'
      - '.github/workflows/desktop-preview.yml'
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: desktop-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: sh -n install.sh
      - name: Install the desktop preview from this checkout
        shell: bash
        env:
          HDM_INSTALL_DIR: ${{ runner.temp }}/HDM preview/runtime
          HDM_PYTHON: python
        run: sh install.sh "$GITHUB_WORKSPACE"
      - run: python -m pip install -e ".[media,processing,pdf,web,tray,torrent,updates,excel,dev,build]"
      - run: python -m unittest discover -s tests -v
      - name: Desktop UI smoke test
        shell: bash
        run: |
          "$HOME/.local/bin/hdm" --smoke-test
      - run: python scripts/build-desktop.py
      - name: Packaged desktop UI smoke test
        shell: bash
        run: |
          dist/HDM.app/Contents/MacOS/HDM --smoke-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HDM-desktop-preview-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/HDM-*.dmg
          if-no-files-found: error
