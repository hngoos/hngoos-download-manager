name: macOS and Linux desktop preview
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'install.sh'
      - 'pyproject.toml'
      - '.github/workflows/desktop-preview.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb libegl1 libopengl0
      - run: sh -n install.sh
      - name: Install the desktop preview from this checkout
        shell: bash
        env:
          HDM_INSTALL_DIR: ${{ runner.temp }}/HDM preview/runtime
          HDM_PYTHON: python
        run: sh install.sh "$GITHUB_WORKSPACE"
      - run: python -m pip install -e ".[media,processing,pdf,web,tray,torrent,updates,excel,dev,build]"
      - run: python -m unittest discover -s tests -v
      - name: Desktop UI smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a "$HOME/.local/bin/hdm" --smoke-test
          else
            "$HOME/.local/bin/hdm" --smoke-test
          fi
      - run: python scripts/build-desktop.py
      - name: Packaged desktop UI smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a dist/HDM/HDM --smoke-test
          else
            dist/HDM.app/Contents/MacOS/HDM --smoke-test
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HDM-desktop-preview-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/HDM-*-preview.zip
            dist/HDM-*-preview.tar.gz
          if-no-files-found: error
