<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">HDM — hngoos-download-manager</title>
  <desc id="desc">Download. Organize. Get things done. A download manager for Windows 10 and 11, with optional Chromium browser integration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e101a"/><stop offset="1" stop-color="#292041"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c4b5fd" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1130" cy="65" r="235" fill="#a78bfa" opacity=".035"/>
  <circle cx="1130" cy="65" r="180" fill="none" stroke="#a78bfa" opacity=".12"/>
  <circle cx="1130" cy="65" r="120" fill="none" stroke="#a78bfa" opacity=".1"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="64" y="64" fill="#b7a6da" font-size="15" letter-spacing="3" font-weight="600">HNGOOS-DOWNLOAD-MANAGER</text>
    <text x="58" y="170" fill="#f1f5f9" font-size="108" letter-spacing="-5" font-weight="700">HDM</text>
    <text x="64" y="229" fill="#e7dff5" font-size="30" font-weight="600">Download. Organize. Get things done.</text>
    <text x="64" y="268" fill="#aaa3bd" font-size="18">Files, media, and everyday tools. On your Windows desktop.</text>
    <text x="64" y="318" fill="#c4b5fd" font-size="13" letter-spacing="1.5">WINDOWS 10 / 11 x64</text>
    <circle cx="263" cy="313" r="2" fill="#796691"/>
    <text x="283" y="318" fill="#c4b5fd" font-size="13" letter-spacing="1.5">CHROMIUM EXTENSION</text>
  </g>
  <rect x="986" y="102" width="154" height="154" rx="42" fill="#312448" stroke="#6f5297"/>
  <path d="M1063 137v64m-26-25 26 26 26-26M1032 218v13h62v-13" fill="none" stroke="url(#accent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
